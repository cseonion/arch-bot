[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-bot"
version = "0.1.0"
description = "Discord-based LLM assistant for architecture workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.6,<3",
  "openai>=2,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
arch-bot = "arch_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
