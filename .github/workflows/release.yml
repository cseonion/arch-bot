name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 한국어 릴리스 노트 검증 및 추출
        run: python scripts/extract_release_notes.py "$GITHUB_REF_NAME" release-notes.md
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME — 건축봇 업데이트"
          --notes-file release-notes.md
